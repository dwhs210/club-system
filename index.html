<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社團選填</title><link rel="stylesheet" href="style.css"></head><body><header><h1>大灣高中國中部社團選填系統</h1><p id="year"></p></header><main class="wrap"><div id="anns"></div><section class="card" id="login"><h2>學生登入</h2><div class="grid"><div><label>年級</label><select id="grade"><option>國一</option><option>國二</option></select></div><div><label>班級</label><input id="cls"></div><div><label>座號</label><input id="seat"></div><div><label>學號</label><input id="sid"></div></div><button onclick="loginFn()">登入選填</button><div id="msg"></div></section><section class="card hidden" id="wish"><h2 id="stu"></h2><div id="fields"></div><button class="green" onclick="submitFn()">確認送出</button></section></main><script src="config.js"></script><script src="api.js"></script><script>year.textContent=CLUB_SYSTEM_CONFIG.schoolYear;let token="",clubs=[];async function home(){try{const r=await api("public.home");anns.innerHTML=(r.announcements||[]).map(a=>`<div class="notice"><b>📢 ${esc(a.grade)}｜${esc(a.title)}</b><br>${esc(a.content)}</div><br>`).join("")}catch(e){anns.innerHTML=`<p class="err">${esc(e.message)}</p>`}}async function loginFn(){try{const r=await api("student.login",{grade:grade.value,classCode:cls.value.trim(),seatNo:seat.value.trim(),studentNo:sid.value.trim()});token=r.token;clubs=r.clubs;stu.textContent=`${r.student.classCode}班 ${r.student.seatNo}號 ${r.student.name}`;fields.innerHTML=[1,2,3,4,5,6].map(i=>`<label>第${i}志願</label><select class="w"><option value="">請選擇</option>${clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`).join("");login.classList.add("hidden");wish.classList.remove("hidden")}catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`}}async function submitFn(){const v=[...document.querySelectorAll(".w")].map(x=>x.value);if(v.some(x=>!x)||new Set(v).size!==6)return alert("六個志願必須完整且不可重複");if(!confirm("送出後不可自行修改，確定？"))return;try{await api("student.submit",{token,wishes:v});wish.innerHTML='<h2 class="ok">志願已成功送出</h2>'}catch(e){alert(e.message)}}home();</script></body></html>
