<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行政端</title><link rel="stylesheet" href="assets/style.css"></head><body><header><h1>大灣高中國中部社團管理系統</h1><p>Cloud Edition 行政端</p></header><main class="wrap"><section class="card" id="alog"><h2>行政登入</h2><input type="password" id="pw"><button onclick="loginA()">登入</button><div id="amsg"></div></section><section class="hidden" id="app"><div class="tabs"><button onclick="tab('dashboard')">行政首頁</button><button onclick="tab('students')">學生名冊</button><button onclick="tab('clubs')">社團資料</button><button onclick="tab('distribution')">社團分發</button><button onclick="tab('reports')">報表</button><button onclick="tab('settings')">設定</button></div><div id="content"></div></section></main><script src="config.js"></script><script src="assets/api.js"></script><script>let at="";async function loginA(){try{const r=await api("admin.login",{password:pw.value});at=r.token;alog.classList.add("hidden");app.classList.remove("hidden");tab("dashboard")}catch(e){amsg.innerHTML=`<p class="err">${esc(e.message)}</p>`}}async function aa(a,p={}){return api(a,{...p,token:at})}async function tab(t){content.innerHTML="載入中…";try{if(t==="dashboard"){const r=await aa("admin.dashboard");content.innerHTML=["國一","國二"].map(g=>`<section class="card"><h2>${g}</h2><div class="grid"><div class="kpi">學生數<strong>${r[g].students}</strong></div><div class="kpi">社團數<strong>${r[g].clubs}</strong></div><div class="kpi">已完成<strong>${r[g].completed}</strong></div><div class="kpi">未完成<strong>${r[g].missing}</strong></div></div></section>`).join("")}if(t==="students"){const r=await aa("admin.students.list");content.innerHTML=`<section class="card"><h2>學生名冊</h2><input type="file" id="sf"><button onclick="imp('students','sf')">匯入CSV</button><button onclick="exp('students')">匯出CSV</button><table><tr><th>年級</th><th>班級</th><th>座號</th><th>學號</th><th>姓名</th></tr>${r.rows.map(x=>`<tr><td>${x.grade}</td><td>${x.classCode}</td><td>${x.seatNo}</td><td>${x.studentNo}</td><td>${x.name}</td></tr>`).join("")}</table></section>`}if(t==="clubs"){const r=await aa("admin.clubs.list");content.innerHTML=`<section class="card"><h2>社團資料</h2><input type="file" id="cf"><button onclick="imp('clubs','cf')">匯入CSV</button><button onclick="exp('clubs')">匯出CSV</button><table><tr><th>年級</th><th>代號</th><th>名稱</th><th>名額</th></tr>${r.rows.map(x=>`<tr><td>${x.grade}</td><td>${x.code}</td><td>${x.name}</td><td>${x.capacity}</td></tr>`).join("")}</table></section>`}if(t==="distribution")content.innerHTML='<section class="card"><h2>社團分發</h2><button class="green" onclick="dist('國一')">國一開始分發</button><button class="green" onclick="dist('國二')">國二開始分發</button></section>';if(t==="reports")content.innerHTML='<section class="card"><h2>報表</h2><button onclick="report('國一','club')">國一社團名單</button><button onclick="report('國一','class')">國一班級名單</button><button onclick="report('國二','club')">國二社團名單</button><button onclick="report('國二','class')">國二班級名單</button></section>';if(t==="settings"){const r=await aa("admin.settings.get");content.innerHTML=`<section class="card"><h2>設定</h2><label>學年度</label><input id="sy" value="${r.schoolYear}"><label><input type="checkbox" id="g1" ${r.grade1Open?"checked":""}>國一開放</label><label><input type="checkbox" id="g2" ${r.grade2Open?"checked":""}>國二開放</label><button onclick="saveS()">儲存</button></section>`}}catch(e){content.innerHTML=`<p class="err">${esc(e.message)}</p>`}}async function imp(type,id){const f=document.getElementById(id).files[0];if(!f)return;await aa("admin.csv.import",{type,csv:await f.text()});alert("匯入完成");tab(type)}async function exp(type){const r=await aa("admin.csv.export",{type});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+r.csv],{type:"text/csv"}));a.download=r.filename;a.click()}async function dist(g){if(!confirm(`確定執行${g}分發？`))return;const r=await aa("admin.distribution.run",{grade:g});alert(`已分發${r.assigned}人，未分發${r.missing}人`)}async function saveS(){await aa("admin.settings.save",{schoolYear:sy.value,grade1Open:g1.checked,grade2Open:g2.checked});alert("已儲存")}function report(g,t){window.open(`${CLUB_SYSTEM_CONFIG.apiUrl}?action=report&grade=${encodeURIComponent(g)}&type=${t}&token=${encodeURIComponent(at)}`)}</script></body></html>
